spring:
  application:
    name: user-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # NOTE: spring.config.import is intentionally OMITTED from served configs
  # (lives in the client's in-jar application.yml). See api-gateway.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kofax_user}
    username: ${DB_USER:kofax}
    password: ${DB_PASSWORD:kofax}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
  flyway:
    enabled: true
    schemas: user_schema
    default-schema: user_schema
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACE_ENDPOINT:http://localhost:4318/v1/traces}
kofax:
  security:
    jwt:
      issuer: kofax-platform
      audience: kofax-clients
      secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-changeit-changeit}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  user:
    max-failed-attempts: 5
    lockout-duration: PT15M
  outbox:
    poll-interval-ms: 1000
