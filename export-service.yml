spring:
  application:
    name: export-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # NOTE: spring.config.import is intentionally OMITTED from served configs
  # (lives in the client's in-jar application.yml). See api-gateway.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kofax_export}
    username: ${DB_USER:kofax}
    password: ${DB_PASSWORD:kofax}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: export_schema
  flyway:
    schemas: export_schema
    default-schema: export_schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: export-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
      concurrency: 4
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: exportScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            # PostgreSQL stores Quartz job/trigger payloads in `bytea` columns.
            # The default StdJDBCDelegate uses `getBlob()` which on PostgreSQL
            # interprets the column as an OID Large Object pointer and fails
            # with `Bad value for type long : \xaced0005...` (the hex prefix
            # of Java's serialized-object stream).  PostgreSQLDelegate uses
            # `getBytes()` / `setBytes()` which is the correct path for bytea.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
            # Schema resolution is handled via DB_URL `?currentSchema=…` so
            # this stays an un-qualified identifier (Quartz interpolates the
            # prefix into dotted SQL like `<prefix>TRIGGERS T`, and a dotted
            # value produces malformed queries on PostgreSQL).
            tablePrefix: ex_qrtz_
          threadPool:
            threadCount: 5

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

kofax:
  security:
    jwt:
      secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-changeit-changeit}
  storage:
    type: s3
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: us-east-1
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true
    buckets:
      originals: kofax-originals
      pdfs: kofax-pdfs
      ocr: kofax-ocr
      exports: kofax-exports
  export:
    retry:
      max-attempts: 5
      base-backoff: PT30S
      multiplier: 3.0
