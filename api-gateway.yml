spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # NOTE: `spring.config.import: configserver:...` is intentionally OMITTED
  # from configs served by the config-server. Re-introducing it here would
  # cause the config-server's NativeEnvironmentRepository to recursively
  # process the import on every request (each child SpringApplication would
  # re-fetch from itself), saturating the Tomcat thread pool. The clients'
  # in-jar application.yml is the only place that line should appear.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    loadbalancer:
      cache:
        # Mirror eureka.client.registry-fetch-interval-seconds (below).
        # Without this, the gateway caches an empty `ServiceInstanceList` for
        # 35s (LoadBalancerCacheProperties.ttl default) after its first lookup
        # and keeps returning 503 SERVICE_UNAVAILABLE even after the upstream
        # has registered with Eureka — the root cause of the
        # `UnsupportedOperationException … ServerHttpResponse already committed
        # (503 SERVICE_UNAVAILABLE)` cascade observed on every cold start.
        ttl: 5s
        capacity: 256
    gateway:
      discovery:
        locator:
          enabled: false                 # we declare explicit routes for hardening
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Vary Origin
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            redis-rate-limiter.include-headers: false
            key-resolver: '#{@userKeyResolver}'
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 200ms
              maxBackoff: 2s
              factor: 2
              basedOnPreviousValue: false
      routes:
        - id: auth-service
          uri: lb://authentication-service
          predicates: [ "Path=/api/v1/auth/**" ]
          filters:
            - name: CircuitBreaker
              args:
                name: authCb
                fallbackUri: forward:/fallback
        - id: user-service
          uri: lb://user-management-service
          predicates: [ "Path=/api/v1/users/**, /api/v1/internal/users/**" ]
          filters:
            - name: CircuitBreaker
              args:
                name: userCb
                fallbackUri: forward:/fallback
        - id: batch-class-service
          uri: lb://batch-class-service
          predicates: [ "Path=/api/v1/batch-classes/**" ]
          filters:
            - name: CircuitBreaker
              args:
                name: bcCb
                fallbackUri: forward:/fallback
        - id: batch-processing-service
          uri: lb://batch-processing-service
          predicates: [ "Path=/api/v1/batches/**" ]
        - id: scan-upload-service
          uri: lb://scan-upload-service
          predicates: [ "Path=/api/v1/uploads/**" ]
          filters:
            - name: CircuitBreaker
              args:
                name: uploadCb
                fallbackUri: forward:/fallback
            - SetRequestHeader=X-Forwarded-Prefix,/api/v1/uploads
        - id: ocr-service
          uri: lb://ocr-processing-service
          predicates: [ "Path=/api/v1/ocr/**" ]
        - id: validation-service
          uri: lb://validation-service
          predicates: [ "Path=/api/v1/validation/**" ]
        - id: verification-service
          uri: lb://verification-service
          predicates: [ "Path=/api/v1/verification/**" ]
        - id: pdf-service
          uri: lb://pdf-generation-service
          predicates: [ "Path=/api/v1/pdf/**" ]
        - id: export-service
          uri: lb://export-service
          predicates: [ "Path=/api/v1/exports/**" ]
        - id: qc-service
          uri: lb://quality-control-service
          predicates: [ "Path=/api/v1/qc/**" ]
        - id: notification-service
          uri: lb://notification-service
          predicates: [ "Path=/api/v1/notifications/**, /ws/**" ]
        - id: audit-service
          uri: lb://audit-service
          predicates: [ "Path=/api/v1/audit/**" ]
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:*}
            allowedMethods: [ GET,POST,PUT,PATCH,DELETE,OPTIONS ]
            allowedHeaders: [ "*" ]
            exposedHeaders: [ "X-Correlation-Id" ]
            allowCredentials: true

server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    # The gateway typically boots BEFORE the downstream services finish
    # registering with Eureka. With the default 30s registry-fetch interval,
    # the first ~35s of gateway uptime sees `lb://<service>` resolve to an
    # empty instance list, which is then cached by Spring Cloud LoadBalancer
    # for another 35s (LoadBalancerCacheProperties.ttl default). The net
    # effect is ~70s where the gateway returns 503 SERVICE_UNAVAILABLE for
    # any route to a not-yet-registered upstream, even after the upstream
    # has come up. Shorten both windows to ~5s for snappier cold-start.
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 10

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 50
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 5s
    instances:
      authCb:
        baseConfig: default
      userCb:
        baseConfig: default
      bcCb:
        baseConfig: default
      uploadCb:
        baseConfig: default
  timelimiter:
    # Spring Cloud Circuit Breaker wraps every CB-protected call in a
    # TimeLimiter and defaults to 1 second – aggressive enough that on a
    # busy Docker Desktop host (load avg 15+) the reactive chain itself
    # exceeds the budget BEFORE the upstream even responds, producing:
    #   "Did not observe any item or terminal signal within 1000ms in
    #    'circuitBreaker' (and no fallback has been configured)"
    # Bumping to 10s aligns with `slowCallDurationThreshold: 5s` above and
    # gives plenty of slack for the upstream + gateway filters.
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      # Login can be slow on a saturated local Docker Desktop stack because
      # authentication-service does DB work and calls user-management-service.
      authCb:
        baseConfig: default
        timeoutDuration: 45s
      userCb:    { baseConfig: default }
      bcCb:      { baseConfig: default }
      uploadCb:  { baseConfig: default }

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACE_ENDPOINT:http://localhost:4318/v1/traces}

kofax:
  security:
    jwt:
      # MUST match authentication-service's mint-time values (see
      # git-config/authentication-service.yml: kofax.security.jwt.*).
      # The gateway's JwtReactiveAuthenticationManager enforces these via
      # requireIssuer/requireAudience – a mismatch surfaces as
      # "Missing expected '<expected>' value in 'aud' claim [<actual>]".
      issuer:   ${JWT_ISSUER:kofax-platform}
      audience: ${JWT_AUDIENCE:kofax-clients}
      secret:   ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-changeit-changeit}
