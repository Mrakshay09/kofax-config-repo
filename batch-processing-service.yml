spring:
  application:
    name: batch-processing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # NOTE: spring.config.import is intentionally OMITTED from served configs
  # (lives in the client's in-jar application.yml). See api-gateway.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kofax_batch}
    username: ${DB_USER:kofax}
    password: ${DB_PASSWORD:kofax}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: batch_schema
  flyway:
    enabled: true
    schemas: batch_schema
    default-schema: batch_schema
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: batch-processing-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 50
        session.timeout.ms: 30000
        isolation.level: read_committed
    listener:
      ack-mode: manual
      concurrency: 6
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: bpScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            # PostgreSQL stores Quartz job/trigger payloads in `bytea` columns.
            # The default StdJDBCDelegate uses `getBlob()` which on PostgreSQL
            # interprets the column as an OID Large Object pointer and fails
            # with `Bad value for type long : \xaced0005...` (the hex prefix
            # of Java's serialized-object stream).  PostgreSQLDelegate uses
            # `getBytes()` / `setBytes()` which is the correct path for bytea.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
            clusterCheckinInterval: 20000
            # Schema resolution is handled via DB_URL `?currentSchema=…` so
            # this stays an un-qualified identifier (Quartz interpolates the
            # prefix into dotted SQL like `<prefix>TRIGGERS T`, and a dotted
            # value produces malformed queries on PostgreSQL).
            tablePrefix: bp_qrtz_
          threadPool:
            threadCount: 10
server:
  port: 8084
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
kofax:
  security:
    jwt:
      secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-changeit-changeit}
  workflow:
    lock:
      ttl-seconds: 30
    retry:
      max-attempts: 4
      initial-backoff-ms: 10000
      multiplier: 6.0
  outbox:
    poll-interval-ms: 1000
