spring:
  application:
    name: pdf-generation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # NOTE: spring.config.import is intentionally OMITTED from served configs
  # (lives in the client's in-jar application.yml). See api-gateway.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kofax_pdf}
    username: ${DB_USER:kofax}
    password: ${DB_PASSWORD:kofax}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pdf_schema
  flyway:
    schemas: pdf_schema
    default-schema: pdf_schema
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: pdf-generation-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
      concurrency: 4

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

kofax:
  security:
    jwt:
      secret: ${JWT_SECRET:changeit-changeit-changeit-changeit-changeit-changeit-changeit}
  storage:
    type: s3
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: us-east-1
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true
    buckets:
      originals: kofax-originals
      pdfs: kofax-pdfs
      ocr: kofax-ocr
      exports: kofax-exports
